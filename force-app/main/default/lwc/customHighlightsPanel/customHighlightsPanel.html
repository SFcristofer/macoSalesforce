<template>
    <div class="slds-page-header slds-page-header_record-home">
        <div class="slds-page-header__row">
            <div class="slds-page-header__col-title">
                <div class="slds-media">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name={iconName} size="medium"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <div class="slds-page-header__name">
                            <div class="slds-page-header__name-title">
                                <h1>
                                    <span class="slds-page-header__title slds-truncate" title={title}>{title}</span>
                                </h1>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="slds-page-header__row slds-page-header__row_gutters slds-m-top_small">
            <div class="slds-page-header__col-details" style="width: 100%;">
                <lightning-record-view-form record-id={recordId} object-api-name={objectApiName}>
                    <ul class="slds-page-header__detail-row">
                        <template for:each={fieldList} for:item="field">
                            <li class="slds-page-header__detail-block" key={field}>
                                <lightning-output-field field-name={field}></lightning-output-field>
                            </li>
                        </template>
                    </ul>
                </lightning-record-view-form>
            </div>
        </div>
    </div>
</template>
