<template>
    <lightning-card title="Master Boxes" icon-name="custom:custom93">
        <div class="slds-p-around_medium">
            <!-- Header con Total CBM -->
            <div class="slds-text-heading_small slds-m-bottom_medium slds-text-align_right">
                <strong>Total CBM: {totalCBM}</strong>
            </div>

            <lightning-record-edit-form record-id={recordId} object-api-name="Product2" onsuccess={handleSuccess}>
                
                <lightning-accordion active-section-name={activeSections} allow-multiple-sections-open>
                    <!-- CAJA 1 -->
                    <template if:true={showBox1}>
                        <lightning-accordion-section name="Box1" label="Master Box 1">
                            <lightning-layout multiple-rows>
                                <lightning-layout-item size="12" padding="around-small">
                                    <lightning-input-field field-name="Masterbox1_detalle__c"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input-field field-name="MasterboxLargoCm__c"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input-field field-name="MasterboxAnchoCm__c"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input-field field-name="MasterboxAltoCm__c"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input-field field-name="MasterboxPesoKg__c"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input-field field-name="MasterboxM3__c" onchange={handleCBMChange}></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input-field field-name="UnidadesPorMasterBox__c"></lightning-input-field>
                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-accordion-section>
                    </template>

                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input-field field-name="Masterbox2LargoCm__c"></lightning-input-field>

                                    <lightning-input-field field-name="Masterbox2PesoKg__c"></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small">
                                    <lightning-input-field field-name="Masterbox2M3__c" onchange={handleCBMChange}></lightning-input-field>
                                </lightning-layout-item>
                                <lightning-layout-item size="6" padding="around-small" class="slds-text-align_right">
                                    <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Eliminar Caja 2" class="slds-m-top_large" onclick={handleRemoveBox2}></lightning-button-icon>

                    <template if:true={canAddMore}>
